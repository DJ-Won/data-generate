initialization:
  world_up: [0.0, 1.0, 0.0]

  reference_match:
    preview_width: 512
    preview_height: 512
    seed_pose: null
    search_radius_ratio: 0.15
    yaw_search_range_deg: [-180.0, 180.0]
    pitch_search_range_deg: [-17.5, 17.5]
    roll_search_range_deg: [-7.5, 7.5]

  traversal:
    # Candidate poses are randomized deterministically by random_seed.
    strategy: "random"
    images_per_position_l: 10
    random_seed: 3407
    max_position_sampling_attempts: 30000
    minimum_clearance_radius_ratio: 0.005
    maximum_clearance_radius_ratio: 0.20
    minimum_position_separation_radius_ratio: 0.02

    random:
      # Stop as soon as k accepted captures have topiq_nr > l.
      target_count_k: 10
      topiq_nr_threshold_l: 0.65
      device: "cuda"

  clipping:
    mode: "auto_local"
    near_min: 0.001
    near_radius_ratio: 0.002
    far_radius_ratio: 4.0
